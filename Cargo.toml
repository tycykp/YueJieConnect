[workspace]
members = ["core", "transport", "native"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
getrandom = "=0.2.16"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
